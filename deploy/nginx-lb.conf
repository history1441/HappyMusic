# Nginx 负载均衡器配置 - 分布式部署
#
# 修改下面的 upstream backend_pool，填入所有后端服务器的 IP:端口
# 示例：
#   server 10.0.0.101:9527;  # 后端服务器 1
#   server 10.0.0.102:9527;  # 后端服务器 2
#   server 10.0.0.103:9527;  # 后端服务器 3

upstream backend_pool {
    # ip_hash: 同一客户端 IP 始终路由到同一后端
    # 对 WebSocket 友好，减少跨实例广播
    ip_hash;

    # === 在这里添加所有后端服务器 ===
    server 10.0.0.101:9527;  # backend-1
    server 10.0.0.102:9527;  # backend-2
    # server 10.0.0.103:9527;  # backend-3 (按需添加)

    # 备用：如果某台后端故障，自动切换
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    # ============ HTTP API 代理 ============
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 后端故障自动切换到下一台
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # keepalive 复用
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ============ WebSocket 代理 ============
    location /ws/ {
        proxy_pass http://backend_pool/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 长连接超时（24小时）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============ 健康检查 ============
    location /lb-health {
        access_log off;
        return 200 '{"status":"ok","instance":"lb"}';
        add_header Content-Type application/json;
    }

    # ============ 状态监控 ============
    location /lb-status {
        stub_status on;
        access_log off;
        allow 10.0.0.0/8;     # 允许内网访问
        allow 192.168.0.0/16;
        deny all;
    }
}
