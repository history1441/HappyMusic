# ============================================
# 前端服务器 - Nginx 负载均衡器 + 静态文件
# 部署在前端服务器上，代理请求到多台后端服务器
# ============================================
#
# 使用方式：
#   1. 修改 nginx-lb.conf 中的 upstream backend_pool
#      填入所有后端服务器的 IP:端口
#   2. docker compose -f docker-compose.frontend.yml up -d
#
# 对外暴露端口：
#   80   - HTTP（前端 + API + WebSocket 代理）

version: '3.8'

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: happymusic-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      # 覆盖默认 nginx.conf，指向远程后端服务器
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx-lb
    networks:
      - happymusic-net

  nginx-lb:
    image: nginx:alpine
    container_name: happymusic-nginx-lb
    restart: unless-stopped
    ports:
      - "${LB_PORT:-8080}:80"
    volumes:
      # 负载均衡配置（包含所有后端服务器地址）
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
    networks:
      - happymusic-net

networks:
  happymusic-net:
    driver: bridge
