# ============================================
# 后端服务器 - 单实例部署
# 部署在每台后端服务器上，连接共享的 MySQL + Redis
# ============================================
#
# 使用方式：
#   1. 复制 .env.dist 到 .env，修改以下变量：
#      - INSTANCE_ID（每台服务器不同：backend-1, backend-2...）
#      - MYSQL_HOST（基础设施服务器 IP）
#      - REDIS_HOST（基础设施服务器 IP）
#   2. docker compose -f docker-compose.backend.yml up -d
#
# 对外暴露端口：
#   9527 - FastAPI 后端（HTTP + WebSocket）

version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: happymusic-${INSTANCE_ID:-backend}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9527}:9527"
    environment:
      # 实例标识（每台服务器不同）
      INSTANCE_ID: ${INSTANCE_ID:-backend-1}
      WS_BROADCAST_CHANNEL: ${WS_BROADCAST_CHANNEL:-happymusic:ws:broadcast}

      # 连接共享基础设施（远程地址）
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-happymusic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-happymusic}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # JWT（所有实例必须相同）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}

      # AI 配置（可选）
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-3.5-turbo}

      # 调试
      HAPPYMUSIC_DEBUG: ${HAPPYMUSIC_DEBUG:-false}
      TZ: Asia/Shanghai

    volumes:
      # 挂载源码用于热更新（可选）
      - ../backend/app:/app/app
      # TTS 缓存目录
      - tts_cache:/app/tts_cache
      # 构建产物（可选，如果服务器需要托管 APK）
      - ../builds:/app/builds
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9527/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - happymusic-net

volumes:
  tts_cache:

networks:
  happymusic-net:
    driver: bridge
