name: Build & Release APK/IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(可选,留空使用 package.json)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Patch RNTP Kotlin null safety
        run: |
          FILE=node_modules/react-native-track-player/android/src/main/java/com/doublesymmetry/trackplayer/module/MusicModule.kt
          if [ -f "$FILE" ]; then
            sed -i 's/Arguments.fromBundle(musicService.tracks\[index\].originalItem)/Arguments.fromBundle(musicService.tracks[index].originalItem!!)/' "$FILE"
            sed -i 's/musicService.tracks\[musicService.getCurrentTrackIndex()\].originalItem$/musicService.tracks[musicService.getCurrentTrackIndex()].originalItem!!/' "$FILE"
            echo "RNTP patched"
          else
            echo "RNTP file not found, skip patch"
          fi

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
            artifacts/HappyMusic-${{ github.ref_name || 'dev' }}-android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/artifacts/*.apk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/artifacts/*.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: true

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true  # iOS 构建可能因签名问题失败,不阻塞 Android
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build IPA (unsigned)
        run: |
          cd ios
          # 未签名构建:导出未签名的 IPA,用户后续用 AltStore/Sideloadly 自行签名
          xcodebuild -workspace HappyMusic.xcworkspace \
            -scheme HappyMusic \
            -configuration Release \
            -archivePath build/HappyMusic.xcarchive \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

          mkdir -p build/Payload
          cp -r build/HappyMusic.xcarchive/Products/Applications/HappyMusic.app build/Payload/
          cd build && zip -qr HappyMusic-${{ github.ref_name || 'dev' }}-ios-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile/ios/build/*.ipa

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/ios/build/*.ipa
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
