# Nginx 负载均衡器配置 - 单机部署（Docker Compose 网络）
#
# 用于 docker-compose.yml 中的 nginx-lb 服务
# 后端实例通过 Docker 服务名访问

upstream backend_pool {
    # ip_hash: 同一客户端 IP 始终路由到同一后端
    # 对 WebSocket 友好，减少跨实例广播
    ip_hash;

    server backend-1:9527;
    server backend-2:9527;
    # 按需添加更多实例

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    # ============ HTTP API 代理 ============
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 后端故障自动切换
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ============ WebSocket 代理 ============
    location /ws/ {
        proxy_pass http://backend_pool/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 长连接超时（24小时）
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============ 健康检查 ============
    location /lb-health {
        access_log off;
        return 200 '{"status":"ok","instance":"lb"}';
        add_header Content-Type application/json;
    }
}
