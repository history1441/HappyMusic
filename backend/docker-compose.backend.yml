# 后端实例基础配置（被 docker-compose.yml 引用）
# 通过 extends 复用，每个实例有不同的端口映射

version: '3.8'

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    - MYSQL_HOST=mysql
    - MYSQL_PORT=3306
    - MYSQL_USER=happymusic
    - MYSQL_PASSWORD=${MYSQL_PASSWORD:-happymusic_pass_2026}
    - MYSQL_DATABASE=happymusic
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - JWT_SECRET_KEY=${JWT_SECRET_KEY:-happymusic-secret-change-in-prod-2026}
    - TZ=Asia/Shanghai
    - HAPPYMUSIC_DEBUG=false
  volumes:
    - /opt/happymusic/backend/.env:/app/.env
    - /opt/happymusic/frontend:/app/frontend
    - /opt/happymusic/builds:/app/builds
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
